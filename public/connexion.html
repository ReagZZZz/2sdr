<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2SDR — Connexion</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--noir:#000;--graphite:#1A1A1A;--acier:#262626;--rouge:#E30613;--rouge-fonce:#B0040F;--blanc:#fff;--os:#D9D4CC;--gris:#9A958E;--or:#F5B700;--vert:#0B7A3B;
  --f-display:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;--f-texte:"Archivo",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100svh;background:var(--noir);color:var(--blanc);font:400 16px/1.5 var(--f-texte);display:grid;place-items:center;padding:24px}
:focus-visible{outline:3px solid var(--or);outline-offset:2px;border-radius:6px}
a{color:inherit}
.pass{width:min(420px,100%);background:var(--blanc);color:var(--noir);border:7px solid var(--blanc);border-radius:22px;overflow:hidden;box-shadow:0 30px 60px -24px rgba(227,6,19,.45)}
.bande{background:var(--noir);color:var(--blanc);border-radius:14px 14px 0 0;padding:30px 22px 18px;position:relative;display:flex;align-items:center;justify-content:space-between}
.bande::before{content:"";position:absolute;top:12px;left:50%;width:56px;height:10px;margin-left:-28px;border-radius:99px;background:#222}
.bande img{height:64px;width:auto}
.bande p{font:800 .95rem/1 var(--f-display);letter-spacing:.06em;color:var(--os)}
.corps{padding:20px 22px 24px}
.staff{font:900 4.6rem/.8 var(--f-display);color:var(--rouge)}
h1{font:900 1.7rem/1 var(--f-display);text-transform:uppercase;margin:10px 0 18px}
form{display:grid;gap:14px}
label{display:grid;gap:6px;font-weight:600;font-size:.9rem}
input{font:500 1rem var(--f-texte);color:var(--noir);background:#F1EEE9;border:2px solid transparent;border-radius:8px;padding:13px 14px;width:100%}
input:focus{outline:none;border-color:var(--rouge)}
.err{color:var(--rouge-fonce);font-size:.88rem;font-weight:600;min-height:1.2em}
.ok{color:var(--vert);font-weight:600}
.btn{font:700 1rem/1 var(--f-texte);border:0;border-radius:999px;padding:16px 26px;background:var(--rouge);color:var(--blanc);cursor:pointer}
.btn:hover{background:var(--rouge-fonce)}
.btn:disabled{opacity:.5;cursor:wait}
.lien{background:none;border:0;font:600 .88rem var(--f-texte);color:#5c5852;text-decoration:underline;cursor:pointer;padding:0}
.bas{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.88rem;margin-top:16px;color:#5c5852}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="pass">
  <div class="bande"><a href="index.html"><img src="logo-2sdr.png" alt="2SDR, retour au site"></a><p>ÉDITION 2027</p></div>
  <div class="corps">
    <p class="staff" aria-hidden="true">STAFF</p>

    <section id="v-login">
      <h1>Connexion</h1>
      <form id="f-login" novalidate>
        <label>E-mail<input id="email" type="email" autocomplete="email" required></label>
        <label>Mot de passe<input id="mdp" type="password" autocomplete="current-password" required></label>
        <p class="err" id="err" role="alert"></p>
        <button class="btn" type="submit">Me connecter</button>
      </form>
      <div class="bas"><button class="lien" type="button" id="vers-oubli">Mot de passe oublié</button><a href="index.html#inscription">Devenir bénévole</a></div>
    </section>

    <section id="v-oubli" hidden>
      <h1>Mot de passe oublié</h1>
      <form id="f-oubli" novalidate>
        <p style="font-size:.95rem;color:#3b3833">Saisis ton e-mail : on t'envoie un lien pour choisir un nouveau mot de passe.</p>
        <label>E-mail<input id="email2" type="email" autocomplete="email" required></label>
        <p class="err" id="err2" role="alert"></p>
        <button class="btn" type="submit">Recevoir le lien</button>
      </form>
      <p class="ok" id="ok2" role="status" hidden></p>
      <div class="bas"><button class="lien" type="button" id="vers-login">Retour à la connexion</button></div>
    </section>
  </div>
</main>
<script src="api.js"></script>
<script>
const $=s=>document.querySelector(s);
const suite=new URLSearchParams(location.search).get("suite");
function aller(r){
  if(suite==="admin"&&r.admin) return location.href="admin.html";
  if(r.benevole) return location.href="benevoles.html";
  if(r.admin) return location.href="admin.html";
}
// Déjà connecté : on file directement à l'espace
api("/api/session").then(aller).catch(()=>{});

$("#f-login").addEventListener("submit",async e=>{
  e.preventDefault();
  const em=$("#email"),mdp=$("#mdp"),err=$("#err"),btn=e.submitter||$("#f-login .btn");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em.value.trim())){err.textContent="Saisis une adresse e-mail valide.";return em.focus()}
  if(!mdp.value){err.textContent="Saisis ton mot de passe.";return mdp.focus()}
  err.textContent="";btn.disabled=true;
  try{aller(await api("/api/login",{body:{email:em.value.trim(),password:mdp.value}}))}
  catch(x){err.textContent=x.message;mdp.select()}
  finally{btn.disabled=false}
});
$("#vers-oubli").onclick=()=>{$("#v-login").hidden=true;$("#v-oubli").hidden=false;$("#email2").value=$("#email").value;$("#email2").focus()};
$("#vers-login").onclick=()=>{$("#v-oubli").hidden=true;$("#v-login").hidden=false;$("#email").focus()};
$("#f-oubli").addEventListener("submit",async e=>{
  e.preventDefault();
  const em=$("#email2"),err=$("#err2"),btn=$("#f-oubli .btn");
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em.value.trim())){err.textContent="Saisis une adresse e-mail valide.";return em.focus()}
  err.textContent="";btn.disabled=true;
  try{
    const r=await api("/api/mot-de-passe-oublie",{body:{email:em.value.trim()}});
    $("#f-oubli").hidden=true;$("#ok2").hidden=false;
    $("#ok2").textContent=r.mail?`Si ${em.value.trim()} correspond à un compte, un lien vient d'y être envoyé. Il est valable 2 heures.`
      :"L'envoi d'e-mails n'est pas encore activé. Demande un nouveau lien à l'équipe : contact@2sdr.fr.";
  }catch(x){err.textContent=x.message}
  finally{btn.disabled=false}
});
</script>
</body>
</html>
