<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2SDR — Administration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--noir:#000;--graphite:#1A1A1A;--acier:#262626;--trait:#333;--rouge:#E30613;--rouge-fonce:#B0040F;--rouge-doux:rgba(227,6,19,.16);
  --blanc:#fff;--os:#D9D4CC;--gris:#9A958E;--or:#F5B700;--or-doux:rgba(245,183,0,.15);--vert:#1FCB6A;--vert-doux:rgba(31,203,106,.15);
  --montage:#3D8BFF;--festival:#E30613;--demontage:#F5B700;
  --f-display:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;--f-texte:"Archivo",system-ui,sans-serif;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html,body{overflow-x:clip}
body{background:var(--noir);color:var(--blanc);font:400 15px/1.5 var(--f-texte);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--or);outline-offset:2px;border-radius:6px}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}

/* ===== Barre latérale ===== */
.side{background:var(--graphite);border-right:1px solid var(--trait);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px;text-decoration:none}
.brand img{height:44px;width:auto}
.brand b{font:900 1.4rem/1 var(--f-display);text-transform:uppercase;display:block}
.brand small{color:var(--gris);font-weight:600}
.menu{display:flex;flex-direction:column;gap:2px}
.menu button{display:flex;align-items:center;gap:12px;background:none;border:0;padding:11px 12px;border-radius:10px;font-weight:600;color:var(--os);text-align:left}
.menu button svg{width:19px;height:19px;flex:none}
.menu button:hover{background:var(--acier)}
.menu button[aria-current="page"]{background:var(--rouge);color:var(--blanc)}
.menu .cpt{margin-left:auto;background:var(--acier);border-radius:999px;font-size:.75rem;padding:1px 8px}
.menu button[aria-current="page"] .cpt{background:rgba(0,0,0,.25)}
.side-bas{margin-top:auto;display:grid;gap:6px;font-size:.88rem}
.side-bas a{color:var(--gris);text-decoration:none;padding:6px 12px;border-radius:8px}
.side-bas a:hover{color:var(--blanc);background:var(--acier)}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;height:auto;flex-direction:row;align-items:center;padding:10px 12px;z-index:30;gap:10px;border-right:0;border-bottom:1px solid var(--trait)}
  .brand div,.side-bas{display:none}
  .menu{flex-direction:row;overflow-x:auto;scrollbar-width:none}
  .menu button{white-space:nowrap;padding:9px 12px}
  .menu button svg{display:none}
}

/* ===== Contenu ===== */
main{padding:26px clamp(16px,3vw,40px) 60px;min-width:0}
.tete{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.tete h1{font:900 clamp(2.2rem,4.5vw,3.4rem)/.9 var(--f-display);text-transform:uppercase}
.tete p{color:var(--gris);margin-top:6px;max-width:70ch}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:10px 18px;font-weight:700;font-size:.9rem;text-decoration:none;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn-rouge{background:var(--rouge);color:var(--blanc)}.btn-rouge:hover{background:var(--rouge-fonce)}
.btn-gris{background:var(--acier)}.btn-gris:hover{background:#333}
.btn-blanc{background:var(--blanc);color:var(--noir)}
.btn-s{padding:6px 12px;font-size:.8rem}
.ico{background:var(--acier);border:0;border-radius:8px;width:32px;height:32px;display:inline-grid;place-items:center}
.ico:hover{background:#3a3a3a}
.ico svg{width:16px;height:16px}
.ico.danger:hover{background:var(--rouge)}

/* Cartes KPI */
/* Tableau d'affichage : une bande de chiffres, pas des tuiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:26px;border-block:2px solid var(--blanc)}
.kpi{padding:16px 20px 18px;position:relative}
.kpi+.kpi{border-left:1px solid var(--trait)}
.kpi:first-child{padding-left:0}
.kpi b{font:900 clamp(2.6rem,4vw,3.6rem)/.9 var(--f-display);display:block;font-variant-numeric:tabular-nums}
.kpi span{color:var(--os);font-size:.88rem;font-weight:600;display:block;margin-top:6px}
.kpi small{display:block;margin-top:2px;font-size:.8rem;font-weight:600;color:var(--gris)}
.kpi.rouge b{color:var(--rouge)}
@media (max-width:640px){.kpi:nth-child(odd){padding-left:0;border-left:0}.kpi{border-top:1px solid var(--trait)}}
.ok{color:var(--vert)}.warn{color:var(--or)}.ko{color:#ff6b73}
.grille2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
@media (max-width:1100px){.grille2{grid-template-columns:1fr}}
.carte{background:var(--graphite);border-radius:var(--r);padding:18px}
.carte h2{font:900 1.6rem/1 var(--f-display);text-transform:uppercase;margin-bottom:14px}

/* Barres de couverture */
.barres{display:grid;gap:10px}
.barre{display:grid;grid-template-columns:70px 1fr 64px;gap:12px;align-items:center;font-size:.88rem;font-weight:600}
.barre .rail{height:26px;background:var(--acier);border-radius:4px;overflow:hidden}
.barre .rail i{display:block;height:100%;background:var(--c);width:0}
.barre em{font:900 1.3rem/1 var(--f-display);font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.alertes{list-style:none;display:grid;gap:8px}
.alertes li{display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--trait);padding:10px 0;font-size:.9rem}
.alertes li:last-child{border-bottom:0}
.alertes li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--c,var(--or));margin-top:7px}
.alertes button{margin-left:auto;background:none;border:0;color:var(--os);font-weight:700;font-size:.8rem;text-decoration:underline;white-space:nowrap}

/* Filtres + tableaux */
.filtres{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.champ{background:var(--graphite);border:2px solid transparent;border-radius:10px;padding:9px 12px;min-width:0}
.champ:focus{outline:none;border-color:var(--rouge)}
input.champ[type=search]{width:min(260px,100%)}
.table-wrap{background:var(--graphite);border-radius:var(--r);overflow:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:left;font-weight:700;color:var(--gris);font-size:.78rem;padding:12px 14px;border-bottom:1px solid var(--trait);white-space:nowrap;position:sticky;top:0;background:var(--graphite)}
td{padding:10px 14px;border-bottom:1px solid #262626;vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#202020}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.nom{font-weight:700}
.sous{display:block;font-size:.8rem;color:var(--gris);font-weight:500}
.badge{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:.75rem;padding:3px 9px;border-radius:999px;white-space:nowrap;border:0}
.b-ok{background:var(--vert-doux);color:var(--vert)}
.b-wait{background:var(--or-doux);color:var(--or)}
.b-ko{background:var(--rouge-doux);color:#ff7a82}
.b-gris{background:var(--acier);color:var(--os)}
.b-chef{background:var(--or);color:var(--noir)}
button.badge:hover{filter:brightness(1.2)}
td select.champ{padding:6px 8px;background:var(--acier)}
.vide{padding:30px;text-align:center;color:var(--gris)}
.pied-table{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;color:var(--gris);font-size:.85rem;flex-wrap:wrap;gap:8px}

/* Matrice planning */
.matrice td,.matrice th{text-align:center;padding:8px}
.matrice th:first-child,.matrice td:first-child{text-align:left}
.cell{border:0;border-radius:8px;padding:8px 6px;min-width:62px;font-weight:800;font-size:.85rem;background:var(--acier)}
.cell small{display:block;font-weight:600;font-size:.68rem;opacity:.8}
.cell.c-ok{background:var(--vert-doux);color:var(--vert)}
.cell.c-mid{background:var(--or-doux);color:var(--or)}
.cell.c-ko{background:var(--rouge-doux);color:#ff8a91}
.cell.c-na{background:transparent;color:#444}
.cell:hover:not(:disabled){outline:2px solid var(--blanc)}
.ph{display:block;width:100%;height:4px;border-radius:2px;background:var(--c);margin-bottom:4px}

/* Groupes */
.groupes{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.groupe{background:var(--graphite);border-radius:var(--r);padding:18px;display:grid;gap:12px;border-top:4px solid var(--c)}
.groupe h3{font:900 1.9rem/1 var(--f-display);text-transform:uppercase}
.groupe .heure{font:900 2.4rem/1 var(--f-display);color:var(--rouge)}
.groupe dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.88rem}
.groupe dt{color:var(--gris)}
.groupe .chips{display:flex;gap:6px;flex-wrap:wrap}
.groupe .bas{display:flex;justify-content:space-between;align-items:center}
.conducteur{list-style:none;display:grid;gap:0;margin-bottom:18px;background:var(--graphite);border-radius:var(--r);padding:6px 18px}
.conducteur li{display:grid;grid-template-columns:110px 1fr auto;gap:14px;padding:10px 0;border-bottom:1px solid #262626;align-items:center}
.conducteur li:last-child{border:0}
.conducteur time{font:900 1.4rem var(--f-display);color:var(--rouge)}

/* Stock */
.stock-l{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.stock-l .ico{width:28px;height:28px}
.jauge{height:6px;background:var(--acier);border-radius:99px;overflow:hidden;width:80px;display:inline-block;vertical-align:middle;margin-left:8px}
.jauge i{display:block;height:100%;background:var(--c)}

/* Modale */
dialog{margin:auto;border:0;border-radius:20px;background:var(--graphite);color:var(--blanc);padding:24px;width:min(520px,94vw);max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.75)}
dialog h2{font:900 2rem/1 var(--f-display);text-transform:uppercase;margin-bottom:16px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:grid;gap:5px;font-weight:600;font-size:.85rem}
.form label.plein{grid-column:1/-1}
.form .champ{background:var(--acier);width:100%}
.form-bas{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
@media (max-width:520px){.form{grid-template-columns:1fr}}
.liste-noms{list-style:none;display:grid;gap:6px;max-height:50vh;overflow:auto}
.liste-noms li{background:var(--acier);border-radius:8px;padding:8px 12px;display:flex;justify-content:space-between;gap:10px}
textarea.champ{min-height:220px;font:500 .8rem/1.4 ui-monospace,monospace}

.toast{visibility:hidden;position:fixed;left:50%;bottom:24px;transform:translate(-50%,150%);background:var(--blanc);color:var(--noir);padding:12px 20px;border-radius:999px;font-weight:700;z-index:100;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.toast.on{visibility:visible;transform:translate(-50%,0)}

.sel{width:18px;height:18px;accent-color:var(--rouge)}
.param{display:grid;gap:14px;max-width:640px}
.param .ligne{display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--graphite);border-radius:var(--r);padding:16px 18px}
.param .ligne b{display:block}
.param .ligne span{color:var(--gris);font-size:.88rem}
.switch{width:50px;height:28px;border-radius:999px;border:0;background:var(--acier);position:relative;flex:none;transition:background .18s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--blanc);transition:transform .18s}
.switch[aria-checked="true"]{background:var(--rouge)}
.switch[aria-checked="true"]::after{transform:translateX(22px)}

/* Newsletter */
.cycle{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px;counter-reset:c}
@media (max-width:1200px){.cycle{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.cycle{grid-template-columns:1fr}}
.camp{background:var(--graphite);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--c,var(--acier));position:relative}
.camp.prochaine{box-shadow:inset 0 0 0 2px var(--rouge)}
.camp .q{font-size:.78rem;font-weight:700;color:var(--gris);display:flex;justify-content:space-between;gap:8px}
.camp .q::before{counter-increment:c;content:counter(c);width:22px;height:22px;border-radius:50%;background:var(--acier);display:inline-grid;place-items:center;color:var(--blanc);font-size:.75rem;margin-right:auto}
.camp h3{font:900 1.45rem/1 var(--f-display);text-transform:uppercase}
.camp .obj{font-size:.88rem;color:var(--os)}
.camp .date{font:900 1.6rem/1 var(--f-display);color:var(--rouge)}
.camp .date small{font:600 .78rem var(--f-texte);color:var(--gris);display:block;margin-top:3px}
.camp .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
dialog.large{width:min(1100px,96vw)}
.editeur{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:900px){.editeur{grid-template-columns:1fr}}
.editeur textarea.champ{min-height:190px;font:500 .9rem/1.5 var(--f-texte);width:100%}
.apercu-mail{background:#e9e6e1;border-radius:12px;padding:16px;max-height:68vh;overflow:auto}
.apercu-mail .meta{font-size:.8rem;color:#555;margin-bottom:10px;line-height:1.4}
.apercu-mail .meta b{color:#111}
.astuce{font-size:.8rem;color:var(--gris)}
.astuce code{background:var(--acier);padding:1px 6px;border-radius:5px;color:var(--os)}
.mec-liste{display:grid;gap:8px}
.mec-carte{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--graphite);border-radius:var(--r);padding:10px 14px 10px 10px}
.mec-carte.inactif{opacity:.55}
.mec-logo{background:#fff;border-radius:10px;height:76px;display:grid;place-items:center;padding:8px;color:#000;font:900 1.1rem var(--f-display);text-transform:uppercase;text-align:center}
.mec-logo img{max-width:100%;max-height:60px;object-fit:contain}
.mec-info b{display:block;font-size:1.05rem}
.mec-info a{text-decoration:none}.mec-info a:hover{text-decoration:underline}
.mec-act{display:flex;gap:6px;align-items:center}
.mec-act .ico:disabled{opacity:.3;cursor:default}
.mec-apercu{background:#fff;border-radius:12px;min-height:110px;display:grid;place-items:center;padding:12px;color:#555}
.mec-logo.sombre,.mec-apercu.sombre{background:#1d1d1d;color:#fff}
.mec-apercu img{max-width:100%;max-height:90px;object-fit:contain}
@media (max-width:700px){.mec-carte{grid-template-columns:110px 1fr}.mec-act{grid-column:1/-1;justify-content:flex-end}}
.lien-acces{display:block;margin-top:3px;background:none;border:0;padding:0;color:var(--or);font:600 .8rem var(--f-texte);text-decoration:underline;cursor:pointer}
</style>
</head>

<script>
/* =========================================================
   DONNÉES D'EXEMPLE — à brancher sur la base MySQL existante
   ========================================================= */
const JOURS=[["2027-10-25","montage"],["2027-10-26","montage"],["2027-10-27","montage"],["2027-10-28","montage"],["2027-10-29","montage"],
  ["2027-10-30","festival"],["2027-10-31","demontage"],["2027-11-01","demontage"],["2027-11-02","demontage"]]
  .map(([iso,ph])=>{const d=new Date(iso+"T12:00:00");return{iso,ph,l:d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric"}).replace(".","")}});
const PHC={montage:"var(--montage)",festival:"var(--festival)",demontage:"var(--demontage)"};
const POLES=["Restauration","Bar","Montage/Démontage","Accueil","Sécurité","Kids du rock"];
const TAILLES=["XS","S","M","L","XL","XXL"];
const CRENEAUX=["M","AM","S"];

// Besoins (nombre de bénévoles souhaités par jour, toutes tranches confondues)
const BESOINS_DEF={
  "Restauration":{montage:3,festival:12,demontage:3},
  "Bar":{montage:0,festival:14,demontage:1},
  "Montage/Démontage":{montage:10,festival:4,demontage:10},
  "Accueil":{montage:0,festival:8,demontage:0},
  "Sécurité":{montage:0,festival:10,demontage:0},
  "Kids du rock":{montage:0,festival:6,demontage:0}
};

/* =========================================================
   DONNÉES : chargées depuis le serveur, synchronisées à chaque modification
   ========================================================= */
let D=null,META={mail:false,admins:[]},SNAP=null,enCours=null,aRefaire=false;
const clone=o=>JSON.parse(JSON.stringify(o));
const CH_B=["prenom","nom","email","tel","ville","pole","statut","chef","role","taille","coupe","covoit","dispo","responsabilite","acces"];
const CH_C=["email","prenom","source","date","statut"];
async function charger(){
  const r=await api("/api/admin/etat");delete r.ok;META=r.meta;delete r.meta;D=r;SNAP=clone(D);
}
function diffListe(cur,old,champs){
  const o=new Map(old.map(x=>[x.id,x])),up=[];
  cur.forEach(x=>{const a=o.get(x.id);
    if(!a){const f={};champs.forEach(k=>{if(x[k]!==undefined)f[k]=x[k]});up.push({id:x.id,nouveau:true,fields:f});return}
    const f={};champs.forEach(k=>{if(JSON.stringify(x[k])!==JSON.stringify(a[k]))f[k]=x[k]});
    if(Object.keys(f).length)up.push({id:x.id,fields:f})});
  const ids=new Set(cur.map(x=>x.id));
  return{upsert:up,del:old.filter(x=>!ids.has(x.id)).map(x=>x.id)};
}
function aEnvoyer(){
  const docs={};["params","besoins","merch","groupes","inventaire","responsabilites"].forEach(k=>{if(JSON.stringify(D[k])!==JSON.stringify(SNAP[k]))docs[k]=D[k]});
  if(JSON.stringify(D.newsletter.campagnes)!==JSON.stringify(SNAP.newsletter.campagnes))docs.campagnes=D.newsletter.campagnes;
  return{docs,benevoles:diffListe(D.benevoles,SNAP.benevoles,CH_B),contacts:diffListe(D.newsletter.contacts,SNAP.newsletter.contacts,CH_C)};
}
const rien=p=>!Object.keys(p.docs).length&&!p.benevoles.upsert.length&&!p.benevoles.del.length&&!p.contacts.upsert.length&&!p.contacts.del.length;
function save(){
  if(enCours){aRefaire=true;return enCours}
  const p=aEnvoyer();if(rien(p))return Promise.resolve();
  const envoi=clone(D);
  enCours=(async()=>{
    try{
      const r=await api("/api/admin/sync",{body:p});
      const remap=(liste,a,b)=>{const x=liste.find(y=>y.id==a);if(x)x.id=b};
      for(const[a,b]of Object.entries(r.idmap.benevoles)){remap(D.benevoles,a,b);remap(envoi.benevoles,a,b)}
      for(const[a,b]of Object.entries(r.idmap.contacts)){remap(D.newsletter.contacts,a,b);remap(envoi.newsletter.contacts,a,b)}
      SNAP=envoi;
      if(r.refus.length){toast(r.refus.join(" "));await charger();rendre()}
      if(r.invitations.length)montrerInvitations(r.invitations,r.mail);
    }catch(x){
      if(x.status===401)return location.replace("connexion.html?suite=admin");
      toast("Non enregistré : "+x.message);
    }finally{enCours=null;if(aRefaire){aRefaire=false;save()}}
  })();
  return enCours;
}
addEventListener("beforeunload",e=>{if(enCours||(D&&!rien(aEnvoyer()))){e.preventDefault();e.returnValue=""}});
// Retour sur l'onglet : on recharge les données (inscriptions, plannings modifiés par les bénévoles)
addEventListener("focus",async()=>{if(!D||enCours||$("#dlg").open||!rien(aEnvoyer()))return;try{await charger();rendre()}catch(e){}});
function montrerInvitations(liste,mail){
  if(liste.every(i=>i.envoye)){toast(liste.length>1?`${liste.length} invitations envoyées par e-mail`:`Invitation envoyée à ${liste[0].prenom}`);return}
  ouvrirDlg(`<h2>Accès à transmettre</h2><p style="color:var(--os);margin-bottom:12px">${mail?"L'e-mail n'a pas pu partir pour ces bénévoles.":"L'envoi d'e-mails n'est pas encore activé."} Transmets-leur ce lien (SMS, Messenger…) : il leur permet de créer leur mot de passe et reste valable 14 jours.</p>
    <ul class="liste-noms">${liste.filter(i=>!i.envoye).map(i=>`<li style="flex-direction:column;align-items:stretch"><b>${esc(i.prenom)} ${esc(i.nom||"")}</b>
      <span style="display:flex;gap:8px;margin-top:6px"><input class="champ" readonly value="${esc(i.lien)}" style="flex:1;min-width:0"><button type="button" class="btn btn-gris btn-s" data-copie="${esc(i.lien)}">Copier</button></span></li>`).join("")}</ul>
    <div class="form-bas"><button class="btn btn-rouge" value="x">C'est noté</button></div>`);
  document.querySelectorAll("#dlg [data-copie]").forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copie);b.textContent="Copié"}catch(e){b.previousElementSibling.select();toast("Sélectionné : Ctrl+C pour copier")}});
}

/* ===== Utilitaires ===== */
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=v=>String(v).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const nid=a=>Math.max(0,...a.map(x=>x.id))+1;
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("on"),2400)}
const IC={
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  del:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>',
  moins:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/></svg>'
};
const valides=()=>D.benevoles.filter(b=>b.statut==="Validé");
function presents(iso,pole){return valides().filter(b=>b.dispo[iso]&&(!pole||b.pole===pole))}
function couverture(iso,pole){const j=JOURS.find(x=>x.iso===iso),bes=D.besoins[pole][j.ph];return{n:presents(iso,pole).length,bes}}
const etat=(n,b)=>!b?"c-na":n>=b?"c-ok":n>=b*.6?"c-mid":"c-ko";
const restant=m=>m.stock-m.vendu-(m.staff?staffBesoin(m):0);
function staffBesoin(){return 0} // les t-shirts staff sont suivis à part (commande par taille)

/* ===== Export CSV (copie, les téléchargements peuvent être bloqués) ===== */
function exporter(titre,cols,rows){
  const csv=[cols.map(c=>c[0]).join(";"),...rows.map(r=>cols.map(c=>`"${String(c[1](r)??"").replace(/"/g,'""')}"`).join(";"))].join("\n");
  ouvrirDlg(`<h2>${esc(titre)}</h2><p style="color:var(--gris);margin-bottom:10px">${rows.length} lignes au format CSV (séparateur point-virgule, compatible Excel).</p>
    <textarea class="champ" readonly id="csv" style="width:100%">${esc(csv)}</textarea>
    <div class="form-bas"><button class="btn btn-gris" value="x">Fermer</button><button type="button" class="btn btn-gris" id="dl">Télécharger</button><button type="button" class="btn btn-rouge" id="cp">Copier</button></div>`);
  $("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(csv);toast("CSV copié")}catch(e){$("#csv").select();toast("Sélectionné : Ctrl+C pour copier")}};
  $("#dl").onclick=()=>{try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"}));a.download=titre.replace(/\W+/g,"-").toLowerCase()+".csv";a.click()}catch(e){toast("Téléchargement indisponible ici : utilise Copier")}};
}

/* ===== Modale formulaire générique ===== */
function ouvrirDlg(html){$("#dlg-form").innerHTML=html;$("#dlg").showModal()}
function formulaire(titre,champs,val,onSave,suppr){
  ouvrirDlg(`<h2>${esc(titre)}</h2><div class="form">${champs.map(c=>{
    const v=val[c.k]??"",id="f_"+c.k,cl=c.plein?"plein":"";
    if(c.opts) return `<label class="${cl}">${c.l}<select class="champ" id="${id}">${c.opts.map(o=>`<option ${o==v?"selected":""}>${esc(o)}</option>`).join("")}</select></label>`;
    return `<label class="${cl}">${c.l}<input class="champ" id="${id}" type="${c.t||"text"}" value="${esc(v)}" ${c.req?"required":""} ${c.t==="number"?'min="0"':""}></label>`;
  }).join("")}</div><div class="form-bas">${suppr?`<button type="button" class="btn btn-gris" id="suppr" style="margin-right:auto">Supprimer</button>`:""}<button class="btn btn-gris" value="annuler" formnovalidate>Annuler</button><button class="btn btn-rouge" value="ok">Enregistrer</button></div>`);
  $("#dlg-form").onsubmit=e=>{
    if(e.submitter&&e.submitter.value!=="ok") return;
    const out={};champs.forEach(c=>{let v=$("#f_"+c.k).value;if(c.t==="number")v=+v||0;out[c.k]=v});
    onSave(out);save();rendre();toast("Enregistré");
  };
  if(suppr) $("#suppr").onclick=()=>{suppr();save();$("#dlg").close();rendre();toast("Supprimé")};
}

const champsB=[{k:"prenom",l:"Prénom",req:1},{k:"nom",l:"Nom",req:1},{k:"email",l:"E-mail",t:"email"},{k:"tel",l:"Téléphone",t:"tel"},{k:"ville",l:"Ville"},
  {k:"pole",l:"Pôle",opts:POLES},{k:"statut",l:"Statut",opts:["Validé","En attente"]},{k:"taille",l:"Taille t-shirt",opts:TAILLES},{k:"coupe",l:"Coupe",opts:["Homme","Femme"]},
  {k:"responsabilite",l:"Responsable de (stocks)",get opts(){return["Aucune",...((D&&D.responsabilites)||[])]}},
  {k:"acces",l:"Pages de gestion",opts:["Aucune","Mécènes","Trésorerie","Mécènes + trésorerie"]}];
const nr=v=>{if(v.responsabilite==="Aucune")v.responsabilite="";if(v.acces==="Aucune")v.acces="";return v};
A.benevoles=()=>{
  const re=()=>{const pos=$("#q-b").selectionStart;rendre();const q=$("#q-b");q.focus();q.setSelectionRange(pos,pos)};
  $("#q-b").oninput=e=>{fB.q=e.target.value;re()};
  $("#p-b").onchange=e=>{fB.pole=e.target.value;rendre()};
  $("#s-b").onchange=e=>{fB.statut=e.target.value;rendre()};
  const va=$("#val-all");if(va)va.onclick=()=>{filtreBen().forEach(b=>b.statut="Validé");save();rendre();toast("Inscriptions validées")};
  $("#add-b").onclick=()=>formulaire("Nouveau bénévole",champsB,{pole:POLES[0],statut:"Validé",taille:"M",coupe:"Homme"},v=>D.benevoles.push({id:nid(D.benevoles),chef:false,dispo:{},covoit:false,role:"",...nr(v)}));
  $("#exp-b").onclick=()=>exporter("Bénévoles 2SDR",[["Prénom",b=>b.prenom],["Nom",b=>b.nom],["Pôle",b=>b.pole],["Statut",b=>b.statut],["Chef",b=>b.chef?"oui":""],["Téléphone",b=>b.tel],["E-mail",b=>b.email],["Ville",b=>b.ville],["T-shirt",b=>b.taille+" "+b.coupe],
    ...JOURS.map(j=>[j.l,b=>b.dispo[j.iso]?.cren.join("+")||""])],filtreBen());
  $("tbody").addEventListener("click",async e=>{const t=e.target.closest("[data-act]");if(!t||t.tagName==="SELECT")return;const b=D.benevoles.find(x=>x.id==t.closest("tr").dataset.id);

    if(t.dataset.act==="statut"){b.statut=b.statut==="Validé"?"En attente":"Validé";toast(b.statut==="Validé"?`${b.prenom} validé(e)`:`${b.prenom} remis(e) en attente`)}

  $("tbody").addEventListener("change",e=>{const t=e.target;if(t.dataset.act!=="pole")return;const b=D.benevoles.find(x=>x.id==t.closest("tr").dataset.id);b.pole=t.value;save();menu();toast(`${b.prenom} → ${b.pole}`)});
};

/* ----- Planning & repas ----- */
R.planning=()=>{
  const repas=JOURS.map(j=>{const L=valides().filter(b=>b.dispo[j.iso]);const k=j.ph==="festival"?["festM","festS"]:["mfrM","mfrS"];
    const art=j.ph==="festival"?D.groupes.reduce((s,g)=>s+(+g.repas||0),0):0;
    return{j,midi:L.filter(b=>b.dispo[j.iso].repas.includes(k[0])).length,soir:L.filter(b=>b.dispo[j.iso].repas.includes(k[1])).length+art,art}});
  return `<div class="tete"><div><h1>Planning & repas</h1><p>Bénévoles validés présents par pôle et par jour, comparés aux besoins. Clique sur une case pour voir les noms.</p></div>
    <div class="actions"><button class="btn btn-gris" id="exp-r">Exporter les repas</button><button class="btn btn-gris" id="ed-bes">Modifier les besoins</button></div></div>
  <div class="table-wrap" style="margin-bottom:22px"><table class="matrice"><thead><tr><th>Pôle</th>${JOURS.map(j=>`<th><span class="ph" style="--c:${PHC[j.ph]}"></span>${j.l}</th>`).join("")}</tr></thead>
  <tbody>${POLES.map(p=>`<tr><td class="nom">${p}</td>${JOURS.map(j=>{const c=couverture(j.iso,p);
    return `<td><button class="cell ${etat(c.n,c.bes)}" data-p="${p}" data-j="${j.iso}" ${!c.bes&&!c.n?"disabled":""}>${c.bes||c.n?`${c.n}<small>/ ${c.bes}</small>`:"–"}</button></td>`}).join("")}</tr>`).join("")}
  <tr><td class="nom">Total</td>${JOURS.map(j=>{const n=presents(j.iso).length,bes=POLES.reduce((s,p)=>s+D.besoins[p][j.ph],0);return `<td><b>${n}</b><span class="sous">/ ${bes}</span></td>`}).join("")}</tr></tbody></table></div>
  <div class="tete" style="margin-bottom:12px"><div><h1 style="font-size:2rem">Repas à prévoir</h1><p>Pour la cuisine : bénévoles validés ayant réservé, plus les artistes le samedi soir.</p></div></div>
  <div class="table-wrap"><table><thead><tr><th>Jour</th><th>Type</th><th class="num">Midi</th><th class="num">Soir</th><th class="num">Total</th></tr></thead><tbody>
  ${repas.map(r=>`<tr><td class="nom">${r.j.l}</td><td>${r.j.ph==="festival"?"Repas festival":"MFR"}${r.art?`<span class="sous">dont ${r.art} artistes le soir</span>`:""}</td><td class="num">${r.midi}</td><td class="num">${r.soir}</td><td class="num"><b>${r.midi+r.soir}</b></td></tr>`).join("")}
  <tr><td class="nom">Semaine</td><td></td><td class="num">${repas.reduce((s,r)=>s+r.midi,0)}</td><td class="num">${repas.reduce((s,r)=>s+r.soir,0)}</td><td class="num"><b>${repas.reduce((s,r)=>s+r.midi+r.soir,0)}</b></td></tr></tbody></table></div>`;
};
A.planning=()=>{
  document.querySelectorAll(".cell").forEach(c=>c.onclick=()=>{const j=JOURS.find(x=>x.iso===c.dataset.j),L=presents(j.iso,c.dataset.p);
    ouvrirDlg(`<h2>${esc(c.dataset.p)} · ${j.l}</h2>${L.length?`<ul class="liste-noms">${L.map(b=>`<li><span><b>${esc(b.prenom)} ${esc(b.nom)}</b>${b.chef?' <span class="badge b-chef">★ Chef</span>':""}</span><span>${b.dispo[j.iso].cren.map(x=>x==="S"?"Soir":x).join(" · ")}</span></li>`).join("")}</ul>`:`<p class="vide">Personne d'inscrit ce jour-là pour ce pôle.</p>`}
      <div class="form-bas"><button class="btn btn-gris" value="x">Fermer</button></div>`)});
  $("#ed-bes").onclick=()=>{
    const champs=[];POLES.forEach(p=>["montage","festival","demontage"].forEach(ph=>champs.push({k:p+"|"+ph,l:`${p} · ${ph==="demontage"?"démontage":ph}`,t:"number"})));

// Redimensionne le logo dans le navigateur (PNG transparent, 600 × 300 maximum)
function preparerLogo(fichier){
  return new Promise((ok,ko)=>{
    if(!/^image\//.test(fichier.type))return ko(new Error("Choisis une image (PNG, JPG, WebP ou SVG)."));
    const img=new Image(),url=URL.createObjectURL(fichier);
    img.onload=()=>{const k=Math.min(1,600/(img.naturalWidth||600),300/(img.naturalHeight||300));
      const c=document.createElement("canvas");c.width=Math.max(1,Math.round((img.naturalWidth||600)*k));c.height=Math.max(1,Math.round((img.naturalHeight||300)*k));
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
      let d=c.toDataURL("image/png");if(d.length>650000)d=c.toDataURL("image/webp",.9);
      if(d.length>650000)return ko(new Error("Logo trop lourd, même réduit : essaie une image plus simple."));
      // Logo surtout clair (ex. blanc sur transparent) : on le pose sur une plaque sombre
      let lum=0,n=0;try{const px=c.getContext("2d").getImageData(0,0,c.width,c.height).data;for(let i=0;i<px.length;i+=16){if(px[i+3]>128){lum+=(px[i]*299+px[i+1]*587+px[i+2]*114)/1000;n++}}}catch(e){}
      ok({data:d,fond:n&&lum/n>200?"sombre":"clair"})};
    img.onerror=()=>ko(new Error("Impossible de lire cette image."));img.src=url;
  });
}

      if(t.dataset.act==="del"){if(!t.classList.contains("conf")){t.classList.add("conf");t.style.background="var(--rouge)";toast("Clique encore pour supprimer la demande");setTimeout(()=>{t.classList.remove("conf");t.style.background=""},3000);return}
        await api(`/api/admin/demandes/${d.id}`,{body:{supprimer:true}})}
      if(t.dataset.act==="promo"){if(d.statut!=="Acceptée")await api(`/api/admin/demandes/${d.id}`,{body:{statut:"Acceptée"}});return formMecene(null,{nom:d.entreprise})}
      await charger();rendre();
    }catch(x){toast(x.message)}});
};

  <div class="param">

    <div class="ligne"><div><b>Fin des inscriptions bénévoles</b><span>Affichée dans l'espace bénévole.</span></div><input type="date" class="champ" id="p-dl" value="${D.params.deadline}"></div>
    <div class="ligne"><div><b>Inscriptions bénévoles ouvertes</b><span>Le formulaire du site accepte de nouvelles candidatures.</span></div><button class="switch" role="switch" aria-checked="${D.params.inscriptions}" id="p-ins" aria-label="Inscriptions ouvertes"></button></div>

    <div class="ligne" style="display:block"><div><b>Responsabilités avec gestion de stock</b><span>Une par ligne. Chaque responsable nommé voit l'onglet « Mes stocks » dans son espace bénévole. « Merch » est relié au stock du stand merch.</span></div>
      <textarea class="champ" id="p-resp" rows="6" style="width:100%;margin-top:10px;min-height:0;font:500 .95rem/1.5 var(--f-texte)">${esc((D.responsabilites||[]).join("\n"))}</textarea>
      <div style="margin-top:8px"><button type="button" class="btn btn-gris btn-s" id="p-resp-ok">Enregistrer la liste</button></div></div>
    <div class="ligne"><div><b>Lien de la billetterie</b><span>Les boutons « Prendre ma place » du site y mènent. Vide : « billetterie bientôt ouverte ».</span></div><input type="url" class="champ" id="p-bil" placeholder="https://…" value="${esc(D.params.billetterie||"")}" style="min-width:260px"></div>
    <div class="ligne"><div><b>Ouverture des portes</b><span>Affichée dans le programme du site.</span></div><input type="time" class="champ" id="p-ouv" value="${esc(D.params.ouverture||"19:00")}"></div>
    <div class="ligne"><div><b>Envoi des e-mails</b><span>${META.mail?"Actif : invitations, confirmations et newsletters partent automatiquement.":"Pas encore activé : ajoute la clé Resend (RESEND_API_KEY) dans Cloudflare. En attendant, les liens d'accès s'affichent ici pour être transmis à la main."}</span></div><span class="badge ${META.mail?"b-ok":"b-wait"}">${META.mail?"Actif":"Inactif"}</span></div>

      <ul class="liste-noms" style="margin:12px 0">${META.admins.map(a=>`<li><span><b>${esc(a.nom||a.email)}</b> <span class="sous">${esc(a.email)}${a.compte?"":" · invitation en attente"}</span></span><button type="button" class="ico danger" data-adm="${a.id}" aria-label="Retirer l'accès de ${esc(a.email)}">${IC.del}</button></li>`).join("")}</ul>
      <div class="filtres" style="margin:0"><input class="champ" id="adm-nom" placeholder="Prénom" style="width:140px"><input class="champ" id="adm-mail" type="email" placeholder="E-mail" style="flex:1;min-width:180px"><button type="button" class="btn btn-rouge btn-s" id="adm-add">Donner l'accès</button></div></div>
  </div>`;
A.params=()=>{
  $("#p-date").onchange=e=>{D.params.date=e.target.value;save();toast("Date enregistrée")};
  $("#p-dl").onchange=e=>{D.params.deadline=e.target.value;save();toast("Date limite enregistrée")};
  ["ins","ver"].forEach(k=>$("#p-"+k).onclick=e=>{const key=k==="ins"?"inscriptions":"verrou";D.params[key]=!D.params[key];e.currentTarget.setAttribute("aria-checked",D.params[key]);save();
    toast(key==="verrou"?(D.params.verrou?"Plannings verrouillés":"Plannings déverrouillés"):(D.params.inscriptions?"Inscriptions ouvertes":"Inscriptions fermées"))});
  $("#p-resp-ok").onclick=()=>{const l=[...new Set($("#p-resp").value.split("\n").map(x=>x.trim()).filter(Boolean))];if(!l.length)return toast("Garde au moins une responsabilité");D.responsabilites=l;save();rendre();toast("Liste des responsabilités enregistrée")};
  $("#p-bil").onchange=e=>{const v=e.target.value.trim();if(v&&!/^https?:\/\//.test(v))return toast("Le lien doit commencer par https://");D.params.billetterie=v;save();toast(v?"Lien de billetterie enregistré":"Billetterie marquée « bientôt ouverte »")};
  $("#p-ouv").onchange=e=>{D.params.ouverture=e.target.value;save();toast("Heure d'ouverture enregistrée")};
  $("#adm-add").onclick=async ev=>{const em=$("#adm-mail").value.trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em))return toast("Saisis une adresse e-mail valide");
    ev.target.disabled=true;
    try{const r=await api("/api/admin/admins",{body:{email:em,nom:$("#adm-nom").value.trim()}});await charger();rendre();
      montrerInvitations([{prenom:$("#adm-nom")?.value||em,nom:"",lien:r.lien,envoye:r.envoye}],META.mail)}
    catch(x){toast(x.message);ev.target.disabled=false}};
  document.querySelectorAll("[data-adm]").forEach(b=>b.onclick=async()=>{
    try{await api("/api/admin/admins",{body:{supprimer:+b.dataset.adm}});await charger();rendre();toast("Accès retiré")}catch(x){toast(x.message)}});
};

const h=location.hash.slice(1);if(VUES[h])vue=h;
function installation(){
  $("#menu").innerHTML="";
  $("#main").innerHTML=`<div class="tete"><div><h1>Installation</h1><p>Première connexion : crée le compte administrateur. Le code d'installation est celui que tu as défini dans Cloudflare (SETUP_CODE).</p></div></div>
  <form class="carte" id="f-inst" style="max-width:520px;display:grid;gap:12px" novalidate>
    <div class="form"><label class="plein">Code d'installation<input class="champ" id="i-code" type="password" autocomplete="off" required></label>
    <label>Prénom<input class="champ" id="i-nom" autocomplete="given-name"></label><label>E-mail<input class="champ" id="i-mail" type="email" autocomplete="email" required></label>
    <label class="plein">Mot de passe <span class="sous">8 caractères minimum</span><input class="champ" id="i-mdp" type="password" autocomplete="new-password" required></label></div>
    <p class="ko" id="i-err" role="alert" style="min-height:1.2em;font-weight:600"></p>
    <div><button class="btn btn-rouge" type="submit">Créer le compte administrateur</button></div></form>`;
  $("#f-inst").onsubmit=async e=>{e.preventDefault();$("#i-err").textContent="";
    try{await api("/api/admin/installation",{body:{code:$("#i-code").value,nom:$("#i-nom").value,email:$("#i-mail").value,password:$("#i-mdp").value}});demarrer()}
    catch(x){$("#i-err").textContent=x.message}};
}
async function demarrer(){
  try{await charger();rendre()}
  catch(x){
    if(x.status===401){const s=await api("/api/session").catch(()=>({}));if(s.installation)return installation();return location.replace("connexion.html?suite=admin")}
    $("#main").innerHTML=`<p class="vide">${esc(x.message)}</p>`;
  }
}
$(".side-bas").addEventListener("click",async e=>{if(e.target.id!=="deco")return;e.preventDefault();try{await api("/api/logout",{method:"POST"})}catch(x){}location.href="connexion.html"});
demarrer();
</script>
