<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable — 2SDR, Les Saints Sauveurs du Rock</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--noir:#000;--graphite:#1A1A1A;--rouge:#E30613;--blanc:#fff;--os:#D9D4CC;--gris:#9A958E;--or:#F5B700;
  --f-display:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;--f-texte:"Archivo",system-ui,sans-serif;--pad:clamp(20px,5vw,64px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--noir);color:var(--blanc);font:400 17px/1.6 var(--f-texte);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:3px solid var(--or);outline-offset:3px;border-radius:4px}
.nav{border-bottom:1px solid #222;background:rgba(0,0,0,.94);position:sticky;top:0;z-index:5}
.nav .in{max-width:1180px;margin:0 auto;padding:0 var(--pad);height:68px;display:flex;align-items:center;justify-content:space-between}
.nav img{height:46px;width:auto;display:block}
.nav a.retour{font-weight:600;font-size:.92rem;color:var(--os);text-decoration:none}.nav a.retour:hover{color:var(--blanc)}
main{max-width:860px;margin:0 auto;padding:clamp(48px,7vw,90px) var(--pad) 90px}
h1{font:900 clamp(3rem,9vw,5.6rem)/.88 var(--f-display);text-transform:uppercase}
.maj{color:var(--gris);margin-top:14px;font-size:.92rem}
h2{font:900 clamp(1.7rem,3.4vw,2.3rem)/1 var(--f-display);text-transform:uppercase;margin:46px 0 14px;padding-top:18px;border-top:2px solid var(--blanc)}
p,li{color:var(--os);max-width:68ch}
p+p{margin-top:12px}
ul{margin:10px 0 0 1.2em;display:grid;gap:6px}
b,strong{color:var(--blanc)}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 20px;margin-top:6px}
dt{color:var(--gris)}dd{color:var(--blanc)}
@media (max-width:560px){dl{grid-template-columns:1fr}dt{margin-top:8px}}
table{border-collapse:collapse;width:100%;margin-top:10px;font-size:.94rem}
th,td{text-align:left;padding:10px 12px 10px 0;border-bottom:1px solid #2a2a2a;vertical-align:top;color:var(--os)}
th{color:var(--blanc);font-weight:700}
footer{border-top:1px solid #222;padding:30px var(--pad);text-align:center;color:var(--gris);font-size:.9rem}
footer a{text-decoration:none;margin:0 10px}footer a:hover{color:var(--blanc)}
</style>
</head>
<body>
<header class="nav"><div class="in"><a href="index.html"><img src="logo-2sdr.png" alt="2SDR, retour à l'accueil"></a><a class="retour" href="index.html">Retour au site du festival</a></div></header>
<main style="text-align:center;padding-top:clamp(70px,12vw,140px)">
  <p style="font:900 clamp(7rem,26vw,15rem)/.8 var(--f-display);color:var(--rouge);max-width:none">404</p>
  <h1 style="margin-top:18px">Fausse note</h1>
  <p style="margin:18px auto 0">Cette page n'existe pas ou a changé d'adresse. Le concert continue sur la page d'accueil.</p>
  <p style="margin-top:30px;max-width:none"><a href="index.html" style="display:inline-block;background:var(--rouge);color:#fff;text-decoration:none;font-weight:700;padding:16px 26px;border-radius:999px">Retour au festival</a></p>
</main>
<footer><a href="index.html">Accueil</a><a href="mentions-legales.html">Mentions légales</a><a href="confidentialite.html">Confidentialité</a><a href="mailto:contact@2sdr.fr">contact@2sdr.fr</a></footer>
<script src="api.js"></script>
<script>
// Coordonnées de l'association, renseignées dans la trésorerie
api("/api/public").then(d=>{{const a=d.asso||{{}};document.querySelectorAll("[data-asso]").forEach(el=>{{const v=a[el.dataset.asso];if(v)el.textContent=v}})}}).catch(()=>{{}});
</script>
</body>
</html>
